title: "Session 1 — Foundations & Core Concepts"

agenda:
  - "Opening case: a $280K tech investment nobody used — and the TrailBlaze parallel (10 min)"
  - "Concepts: BA mindset, BACCM, stakeholders, and problem statements (25 min)"
  - "Class exercise: apply BACCM to TrailBlaze together — guided (8 min)"
  - "Group exercise: BACCM chart + stakeholder list + problem statement (25 min)"
  - "Practice round: 4 ECBA-style exam questions (8 min)"

homework: "Refine problem statement; 6 exam MCQs"

prompts:
  - "Why can't we fill in the Solution element until we've confirmed the Need?"
  - "Which stakeholder at TrailBlaze is being heard the least — and who's most at risk if this problem isn't solved?"
  - "What makes a problem statement different from a solution statement?"

practice_questions:
  - q: "Which BACCM element identifies who benefits from a change?"
    choices:
      - "Change"
      - "Need"
      - "Stakeholder"
      - "Solution"
    a: 2
  - q: "A good problem statement should be:"
    choices:
      - "Vague and broad"
      - "Measurable and specific"
      - "Solution-oriented"
      - "Optional"
    a: 1
